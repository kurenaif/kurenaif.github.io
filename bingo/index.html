<script>
'use strict';
const board = document.getElementById('bingo');
const statusText = document.getElementById('status');
function toggleCell(cell) {
  const checked = cell.classList.toggle('checked');
  cell.setAttribute('aria-pressed', String(checked));
}
board.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (cell) toggleCell(cell);
});
board.addEventListener('keydown', e => {
  const cell = e.target.closest('.cell');
  if (cell && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); toggleCell(cell);
  }
});
document.getElementById('reset').addEventListener('click', () => {
  board.querySelectorAll('.checked').forEach(cell => {
    cell.classList.remove('checked'); cell.setAttribute('aria-pressed', 'false');
  });
  statusText.textContent = '○をリセットしました。';
});
window.createBingoPNG = async function() {
  await document.fonts.ready;
  const clone = board.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.querySelectorAll('[tabindex]').forEach(el => el.removeAttribute('tabindex'));
  const source = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([source], {type:'image/svg+xml;charset=utf-8'}));
  try {
    const img = new Image();
    await new Promise((resolve,reject) => {img.onload=resolve;img.onerror=reject;img.src=url;});
    const canvas = document.createElement('canvas');
    canvas.width=1600;canvas.height=1600;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,1600,1600);
    ctx.drawImage(img,0,0,1600,1600);
    return canvas.toDataURL('image/png');
  } finally { URL.revokeObjectURL(url); }
};
document.getElementById('download').addEventListener('click', async () => {
  const button = document.getElementById('download');
  button.disabled=true;statusText.textContent='画像を作成しています…';
  try {
    const data=await window.createBingoPNG();
    const link=document.createElement('a');
    link.href=data;link.download='programming_kusomiss_bingo.png';
    document.body.appendChild(link);link.click();link.remove();
    statusText.textContent='保存が始まらない場合は、下の画像を長押しして保存してください。';
    const existing=document.querySelector('.export-preview');
    if (existing) existing.remove();
    const preview=new Image();preview.className='export-preview';preview.alt='保存用ビンゴ画像';preview.src=data;
    document.querySelector('.toolbar').appendChild(preview);
  } catch (error) {
    statusText.textContent='画像を保存できませんでした。表のスクリーンショットをご利用ください。';
  } finally { button.disabled=false; }
});
</script>
